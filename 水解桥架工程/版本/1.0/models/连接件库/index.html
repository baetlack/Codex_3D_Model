<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水解工段 · 连接件模型库</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#dbe6f3;font:14px 'Microsoft YaHei',sans-serif}header{height:82px;padding:17px 24px;border-bottom:1px solid #304054;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0 0 6px}header p{margin:0;color:#93a9be;font-size:12px}header span{color:#68d4dd}.layout{display:grid;grid-template-columns:240px minmax(360px,1fr) 330px;height:calc(100vh - 82px)}nav{padding:16px;border-right:1px solid #304054;overflow:auto}input,select,button{font:inherit;background:#1e2b3c;color:#e4edf8;border:1px solid #40516a;border-radius:6px;padding:8px}nav input,nav select{width:100%;margin-bottom:10px}#list button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;margin:6px 0;padding:7px;font-size:12px}#list img{width:52px;height:46px;object-fit:contain;background:white;border-radius:4px}#list button.active{border-color:#62dce5;background:#244552}#list strong{display:block;color:white;font-size:14px}main{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at center,#21374c,#0d1724)}canvas{width:100%;height:100%;display:block;touch-action:none}.toolbar{position:absolute;left:18px;top:18px;display:flex;gap:7px;flex-wrap:wrap}.toolbar button{font-size:12px;padding:6px 10px}#caption{position:absolute;bottom:18px;left:20px;font-size:12px;color:#9bb7ce;pointer-events:none}aside{padding:20px;overflow:auto;border-left:1px solid #304054;background:#15202f}h2{margin:0 0 7px;font-size:22px}h3{font-size:14px;margin:24px 0 10px;color:#80dce1}.muted{color:#9db1c5;font-size:12px;line-height:1.8}.downloads{display:flex;gap:8px;margin:16px 0}a{color:#71d7e1;text-decoration:none}a:hover{text-decoration:underline}.downloads a{border:1px solid #486278;border-radius:5px;padding:6px 10px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #304054;padding:7px 3px;text-align:left}th{color:#a6bfd1}#shot{width:100%;margin-top:10px;background:black}#notes{padding-left:18px;font-size:12px;line-height:1.9;color:#bac8d7}.badge{font-size:11px;padding:4px 8px;border:1px solid #8d7141;color:#efd29a;border-radius:4px;display:inline-block;margin-top:10px}#count{font-size:12px;color:#8faec4;margin:7px 0}#source{overflow-wrap:anywhere}@media(max-width:1000px){.layout{grid-template-columns:190px 1fr}aside{grid-column:1/3}.layout{height:auto}main{height:65vh}nav{max-height:65vh}} 
</style></head><body>
<header><div><h1>水解工段 · 连接件模型库</h1><p>三层独立连接件 / 补充视图修订 / 本地离线浏览</p></div><span>47 个模型 · v1.2</span></header>
<div class="layout"><nav><input id="search" placeholder="搜索编号、形状或句柄" aria-label="搜索模型"><select id="layer" aria-label="选择层"><option value="">全部三层</option><option value="L1">第一层 · 9</option><option value="L2">第二层 · 21</option><option value="L3">第三层 · 17</option></select><div id="count"></div><div id="list"></div></nav>
<main><canvas id="canvas" aria-label="连接件三维视图"></canvas><div class="toolbar"><button id="iso">轴测</button><button id="top">俯视</button><button id="front">侧视</button><button id="wire">线框 开/关</button><button id="ports">接口 开/关</button><button id="reset">复位</button></div><div id="caption">拖动旋转 · 滚轮缩放 · Shift 拖动平移<br>橙色 A/B/C 为接口，坐标以槽底基点定义</div></main>
<aside><h2 id="title"></h2><div id="shape"></div><span class="badge">修订几何 · 待装配核对</span><div class="downloads"><a id="glb" download>GLB</a><a id="obj" download>OBJ</a><a id="json" download>参数 JSON</a></div><div id="source" class="muted"></div><h3>几何参数（mm）</h3><table id="params"></table><h3>接口</h3><table id="portTable"></table><h3>构造与待复核项</h3><ul id="notes"></ul><h3>原始截图</h3><a id="shotLink" target="_blank" rel="noopener"><img id="shot" style="height:240px;object-fit:contain" alt="该模型对应的原始截图"></a></aside></div>
<script src="viewer_data.js"></script><script src="viewer.js"></script></body></html>
