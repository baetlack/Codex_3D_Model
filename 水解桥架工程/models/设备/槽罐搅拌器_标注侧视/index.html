<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>槽罐搅拌器 · 标注侧视重建</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #151f28; color: #eaf2f7; font: 14px/1.6 'Microsoft YaHei', sans-serif }
  header { padding: 17px 24px; border-bottom: 1px solid #334755 }
  h1 { font-size: 22px; margin: 0 } h2 { font-size: 15px; margin: 0 0 8px }
  .muted { color: #acbfce } .badge { color: #efd1a1; margin-left: .6em; font-size: 13px; white-space: nowrap }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; min-height: calc(100dvh - 94px) }
  main { position: relative; min-height: 530px; background: radial-gradient(ellipse at 50% 42%, #384d5c, #192731 74%) }
  canvas { width: 100%; height: 100%; position: absolute; touch-action: none; cursor: grab }
  canvas:active { cursor: grabbing }
  .tools { position: absolute; display: flex; gap: 6px; top: 15px; left: 16px; right: 16px; flex-wrap: wrap }
  button, select, .file { border: 1px solid #526879; border-radius: 5px; padding: 6px 10px; background: #1b2b38; color: inherit; font: inherit }
  button, select { cursor: pointer } button:hover, .file:hover { background: #2c4558 }
  .hint { position: absolute; bottom: 12px; left: 16px; pointer-events: none }
  aside { padding: 19px 20px; border-left: 1px solid #334755 }
  section + section { margin-top: 20px; padding-top: 15px; border-top: 1px solid #334755 }
  label { display: flex; align-items: center; gap: 8px; margin: 5px 0; cursor: pointer }
  input { accent-color: #81c2d2 } i { width: 12px; height: 12px; background: var(--color); border-radius: 3px }
  p { margin: 0 0 8px } a { color: #b1dce8 } .file { display: inline-block; text-decoration: none; margin: 3px 3px 3px 0 }
  @media(max-width: 760px) { .layout { grid-template-columns: 1fr } main { min-height: 440px; height: 65dvh } aside { border-left: 0; border-top: 1px solid #334755 } }
</style>
<header>
  <h1>槽罐搅拌器 <span class="badge">v0.3 · 比例模型</span></h1>
  <div class="muted">标注侧视重建 · 槽顶安装面 Z=0 · 电机顶暂定 +2.000 m</div>
</header>
<div class="layout">
  <main>
    <canvas id="model" aria-label="槽罐搅拌器交互模型"></canvas>
    <div class="tools">
      <button id="side">正立侧视</button><button id="reset">东南复位</button>
      <button id="drive">仅看传动链</button><button id="all">显示全部</button>
    </div>
    <div class="hint muted" id="hint">拖动旋转 · 滚轮缩放 · 右侧勾选部件</div>
  </main>
  <aside>
    <section><h2>部件</h2>
      <label><input type="checkbox" value="01" checked><i style="--color:#387f7c"></i>01 电机</label>
      <label><input type="checkbox" value="02" checked><i style="--color:#597a98"></i>02 联轴器与座</label>
      <label><input type="checkbox" value="03" checked><i style="--color:#d6a45a"></i>03 双端对称中间轴</label>
      <label><input type="checkbox" value="05" checked><i style="--color:#bb9955"></i>05 独立叶轮</label>
      <label><input type="checkbox" value="06" checked><i style="--color:#6d8497"></i>06 开窗支架与一体轴座</label>
      <label><input type="checkbox" value="07" checked><i style="--color:#9baab4"></i>07 槽顶接口示意</label>
    </section>
    <section><h2>图面依据</h2>
      <p>两处带同轴通孔的轴座与支架连为一体。中间轴两端轮廓镜像，叶轮独立建模。</p>
      <p class="muted">支架连接筋、轴孔间隙和叶轮位置为比例示意。槽体显示顶部接口。</p>
      <a href="../../../data/原始资料/设备/槽罐搅拌器_标注侧视_2026-11-06.png" target="_blank" rel="noopener">查看原始标注侧视</a>
      <br><a href="../../../data/原始资料/设备/槽罐搅拌器_支架红圈修订_2026-11-06.png" target="_blank" rel="noopener">查看支架红圈标注</a>
      <br><a href="../../../data/原始资料/设备/槽罐搅拌器_一体轴座标注_2026-11-06.png" target="_blank" rel="noopener">图一 · 一体轴座</a> · <a href="../../../data/原始资料/设备/槽罐搅拌器_中间轴范围标注_2026-11-06.png" target="_blank" rel="noopener">图二 · 中间轴范围</a>
    </section>
    <section><h2>模型文件</h2>
      <a class="file" href="槽罐搅拌器_v0.3.glb" download>GLB</a>
      <a class="file" href="槽罐搅拌器_v0.3.obj" download>OBJ</a>
      <a class="file" href="槽罐搅拌器_v0.3.mtl" download>MTL</a>
      <p class="muted">GLB 米 / Y 向上<br>OBJ 米 / Z 向上，材质文件需同目录</p>
    </section>
  </aside>
</div>
<script src="model_data.js"></script>
<script src="viewer.js"></script>
</html>
