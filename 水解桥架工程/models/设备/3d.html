<style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e1ecf4;font:14px "Microsoft YaHei",sans-serif}header{padding:16px 22px;border-bottom:1px solid #34475c}h1{font-size:19px;margin:0 0 5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;height:calc(100vh - 62px);min-height:560px}main{position:relative;background:radial-gradient(ellipse at center,#22394c,#0a141e)}canvas{width:100%;height:100%;display:block;touch-action:none}.tools{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap}.tools button,.tools select,a{background:#1a2c3d;color:#e1ecf4;border:1px solid #3a5369;border-radius:5px;padding:8px 10px;font:inherit}.tools button{cursor:pointer}aside{padding:20px;background:#14212e;line-height:1.8;border-left:1px solid #34475c}.muted{color:#9bb0c2;font-size:12px}h2{font-size:14px;color:#8ed4e0;margin:20px 0 7px}a{display:inline-block;text-decoration:none;margin:3px}.hint{position:absolute;bottom:12px;left:15px;color:#a8bdce;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}main{height:65vh}aside{border:0;border-top:1px solid #34475c}}</style>
<header><h1>C4_BH2C 槽罐与搅拌器 · 3D 模型</h1><span class="muted">拖动旋转 · 滚轮缩放 · 可按顺序单独查看部件</span></header><div class="layout"><main><canvas id="c"></canvas><div class="tools"><button id="side">正立侧视</button><button id="iso">轴测</button><button id="reset">复位</button><select id="part"><option value="all">显示全部部件</option><option value="foundation">01 基础与支脚</option><option value="tank">02 直筒平底槽体</option><option value="lid">03 槽盖</option><option value="support">04 圆台形镂空支架</option><option value="drive">05 实体驱动组件</option><option value="shaft">06 轴与叶轮</option></select></div><div class="hint">按住鼠标拖动旋转 · 滚轮缩放</div></main><aside><div class="muted">从下到上逐项建模，零件网格分开，可单独隔离查看。</div><h2>尺寸</h2>槽体 Ø5500 × 高5000 mm<br>搅拌器高出槽顶 2185 mm<br>总高 7185 mm<br>槽底平底，基础和支脚独立<h2>建模顺序</h2>1. 基础与支脚<br>2. 直筒平底槽体<br>3. 槽盖<br>4. 圆台形镂空外壳支架<br>5. 实体回转驱动组件<br>6. 中心轴与叶轮<h2>模型文件</h2><a href="C4_BH2C_tank_mixer.glb" download>GLB</a><a href="C4_BH2C_tank_mixer.obj" download>OBJ</a><br><a href="index.html">返回侧视图</a></aside></div>
<script src="model_data.js"></script><script>
const cv=document.querySelector('#c'),ctx=cv.getContext('2d');let yaw=-Math.PI/2,elev=.08,zoom=1,drag=null,filter='all';
function group(n){if(n.startsWith('Leg_')||n.startsWith('Pad_'))return'foundation';if(n.startsWith('Tank_shell')||n.startsWith('Tank_flat'))return'tank';if(n.startsWith('Tank_cover')||n.startsWith('Lid_'))return'lid';if(n.toLowerCase().includes('support'))return'support';if(/Motor|Gear|Drive_|Coupling|Bearing|Mixer_bridge/.test(n))return'drive';return'shaft'}
function draw(){let d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);let ce=Math.cos(elev),se=Math.sin(elev),cam=[Math.cos(yaw)*ce,Math.sin(yaw)*ce,se],right=[-Math.sin(yaw),Math.cos(yaw),0],up=[-se*Math.cos(yaw),-se*Math.sin(yaw),ce],sc=Math.min(w/700,h/760)*.103*zoom,F=[];
for(let p of MODEL_PARTS){if(filter!=='all'&&group(p.name)!==filter)continue;let color=p.color.slice(1).match(/../g).map(x=>parseInt(x,16));for(let f of p.faces)for(let k=1;k<f.length-1;k++){let q=[f[0],f[k],f[k+1]].map(i=>p.vertices[i].map((v,j)=>v-[0,0,3592.5][j]));let a=q[1].map((v,i)=>v-q[0][i]),b=q[2].map((v,i)=>v-q[0][i]),n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],nl=Math.hypot(...n)||1;n=n.map(v=>v/nl);let lit=Math.max(.3,Math.abs(n[0]*.25-n[1]*.45+n[2]*.86)),pts=q.map(v=>[w/2+v.reduce((s,x,i)=>s+x*right[i],0)*sc,h/2-v.reduce((s,x,i)=>s+x*up[i],0)*sc,v.reduce((s,x,i)=>s+x*cam[i],0)]);F.push({pts,z:pts.reduce((s,x)=>s+x[2],0),c:color.map(x=>Math.round(x*lit))})}}
F.sort((a,b)=>b.z-a.z);for(let f of F){ctx.beginPath();ctx.moveTo(f.pts[0][0],f.pts[0][1]);ctx.lineTo(f.pts[1][0],f.pts[1][1]);ctx.lineTo(f.pts[2][0],f.pts[2][1]);ctx.closePath();ctx.fillStyle=`rgb(${f.c})`;ctx.fill();ctx.strokeStyle='rgba(12,22,29,.22)';ctx.lineWidth=.4;ctx.stroke()}}
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY,yaw,elev];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.008;elev=Math.max(-.1,Math.min(1.25,drag[3]+(e.clientY-drag[1])*.006));draw()};cv.onpointerup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();zoom=Math.max(.35,Math.min(2.8,zoom*(e.deltaY<0?1.1:.9)));draw()};document.querySelector('#side').onclick=()=>{yaw=-Math.PI/2;elev=0;draw()};document.querySelector('#iso').onclick=()=>{yaw=-Math.PI/4;elev=.38;draw()};document.querySelector('#reset').onclick=()=>{yaw=-Math.PI/4;elev=.2;zoom=1;filter='all';document.querySelector('#part').value='all';draw()};document.querySelector('#part').onchange=e=>{filter=e.target.value;draw()};new ResizeObserver(draw).observe(cv);draw();
</script></html>
