const D=JSON.parse(document.getElementById('data').textContent),cv=document.querySelector('#view'),ctx=cv.getContext('2d');let level=null,yaw=-.68,pitch=.72,scale=1,drag=null,selected=null,showLabels=true;const colors={EL100:'#55c7d3',EL106:'#efb35d',EL112:'#b69be8',EL123:'#87c78b'};const all=D.levels.flatMap(l=>l.items.map(i=>({...i,level:l.id,el:l.el})));function visible(){return level?all.filter(a=>a.level===level):all}function setup(){document.querySelector('#levels').innerHTML=D.levels.map(l=>`<button data-l="${l.id}" class="${level===l.id?'on':''}">${l.id}<span>EL${l.el} · ${l.items.length}</span></button>`).join('');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=b.dataset.l;renderUI();draw()});}function renderUI(){setup();const q=document.querySelector('#search').value.toLowerCase();let arr=visible().filter(a=>(a.id+a.name).toLowerCase().includes(q));document.querySelector('#items').innerHTML=arr.map(a=>`<button class="${selected===a.id?'sel':''}" data-id="${a.id}"><b>${a.id}</b><small>${a.name} · ${a.level}</small></button>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id));if(selected){let a=all.find(x=>x.id===selected);if(a)document.querySelector('#detail').innerHTML=`<b>${a.name}</b><br>位号：${a.id}<br>台账位号组：${a.group}<br>平面层：${a.level}（设备底标高 ${a.pos_el??a.el} EL）<br>台账规格：${a.spec||'未提供'}<br>模型外形：${({cylinder:'圆槽罐',coolerPair:'成对立式冷却器',tower:'尾气洗涤塔',demister:'旋流除雾器',pump:'泵体与电机',hoist:'梁下电动葫芦',filter:'过滤器',pit:'地下池'})[a.shape]||'箱式设备'} ${a.w} × ${a.h} mm<br><br><span class="muted">${a.position_basis}<br>${a.height_basis}</span>`;}document.querySelector('#stat').textContent=`${visible().length} 个位号实例 · 单位 mm`;}
function select(id){selected=id;renderUI();draw()}document.querySelector('#search').oninput=renderUI;document.querySelector('#all').onclick=()=>{level=null;renderUI();draw()};document.querySelector('#reset').onclick=()=>{yaw=-.68;pitch=.72;scale=1;draw()};document.querySelector('#labels').onclick=e=>{showLabels=!showLabels;e.target.textContent=showLabels?'隐藏标签':'显示标签';draw()};
function project(p,w,h,cx,cy,s){let X=p[0]-cx,Y=p[1]-cy,Z=p[2],x=X*Math.cos(yaw)-Y*Math.sin(yaw),y=X*Math.sin(yaw)+Y*Math.cos(yaw),yy=y*Math.sin(pitch)+Z*Math.cos(pitch),zz=y*Math.cos(pitch)+Z*Math.sin(pitch);return [w/2+x*s,h/2-yy*s,zz]}
function mixerHeight(id){return window.LAYOUT_MIXER_HEIGHTS?.[id.slice(0,6)]||0;}
function drawTankMixer(tri,cx,cy,mount,id) {
  const factor=mixerHeight(id)/2000;
  if(!factor)return;
  for(const part of window.LAYOUT_MIXER||[]) {
    const vertices=part.vertices.map(([x,y,z])=>[cx+x*factor,cy+y*factor,mount+z*factor]);
    for(const face of part.faces)tri(face.map(i=>vertices[i]),part.color);
  }
}
function meshes(a){let x=a.x,y=a.y,z=a.z,w=a.w,d=a.depth||w*.72,h=a.h,out=[];const tri=(p,mat='shell')=>out.push({p,mat});const quad=(p,mat)=>{tri([p[0],p[1],p[2]],mat);tri([p[0],p[2],p[3]],mat);};const box=(cx,cy,cz,bw,bd,bh,mat='steel',top=true)=>{if(bh<=0)return;let X=bw/2,Y=bd/2,z0=cz,z1=cz+bh,p=[[cx-X,cy-Y,z0],[cx+X,cy-Y,z0],[cx+X,cy+Y,z0],[cx-X,cy+Y,z0],[cx-X,cy-Y,z1],[cx+X,cy-Y,z1],[cx+X,cy+Y,z1],[cx-X,cy+Y,z1]];for(let f of [[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])quad(f.map(i=>p[i]),mat);if(top){quad([p[4],p[5],p[6],p[7]],mat);quad([p[0],p[3],p[2],p[1]],mat);}};const slab=(cx,cy,cz,bw,bd,bh)=>box(cx,cy,cz,bw,bd,bh,'foundation',false);const cyl=(cx,cy,cz,r,hh,profile,mat='shell',n=18)=>{let rings=[];for(let [f,rf] of profile){let ring=[];for(let i=0;i<n;i++){let t=2*Math.PI*i/n;ring.push([cx+Math.cos(t)*r*rf,cy+Math.sin(t)*r*rf,cz+hh*f]);}rings.push(ring);}for(let k=0;k<rings.length-1;k++)for(let i=0;i<n;i++){let j=(i+1)%n;tri([rings[k][i],rings[k][j],rings[k+1][j]],mat);tri([rings[k][i],rings[k+1][j],rings[k+1][i]],mat);}let cap=[cx,cy,cz+hh];for(let i=0;i<n;i++)tri([cap,rings.at(-1)[i],rings.at(-1)[(i+1)%n]],mat);};const tank=(cx,cy,base,diam,hh,id)=>{let tower=id.startsWith('L41B02'),cone=id.startsWith('L41B03')||id.startsWith('D41B01');let profile=tower?[[0,.48],[.025,.5],[.82,.5],[.92,.34],[1,.10]]:cone?[[0,.08],[.17,.5],[.88,.5],[.97,.44],[1,.38]]:[[0,.49],[.025,.5],[.97,.5],[1,.48]];let pad=Math.max(2200,diam+700),fh=id.startsWith('D41B02')?350:250;slab(cx,cy,base-fh,pad,pad,fh);if(id.startsWith('D41B02'))for(let i=0;i<6;i++){let t=2*Math.PI*i/6;cyl(cx+Math.cos(t)*diam*.40,cy+Math.sin(t)*diam*.40,base-1500,260,1150,[[0,1],[1,1]],'foundation',8);}cyl(cx,cy,base,diam/2,hh,profile,'shell',24);/* compact white support shoes, clearly below the shell */let shoe=id.startsWith('D41B02')?300:220;for(let i=0;i<8;i++){let t=2*Math.PI*i/8;cyl(cx+Math.cos(t)*diam*.46,cy+Math.sin(t)*diam*.46,base-shoe,65,shoe,[[0,1],[1,1]],'steel',8);}drawTankMixer(tri,cx,cy,base+hh,id);if(id.startsWith('D41B01'))for(let k=1;k<4;k++){let rr=diam*.44,zz=base+hh*k/5;cyl(cx,cy,zz,rr,22,[[0,1],[1,1]],'steel',18);}};if(a.shape==='coolerPair'){slab(x,y,z-280,w,d,280);for(let dx of [-1200,1200]){let cx=x+dx;cyl(cx,y,z,850,h,[[0,.72],[.05,1],[.9,1],[.97,.82],[1,.78]],'shell',20);for(let sx of [-1,1])for(let sy of [-1,1])box(cx+sx*820,y+sy*820,z,70,70,h,'steel',false);}}else if(['cylinder','tower','demister'].includes(a.shape)){tank(x,y,z,w,h,a.id);}else if(a.shape==='hoist'){box(x,y,z+h*.48,w*1.7,d*.42,100,'machine');box(x,y,z+h*.2,w*.75,d*.65,h*.38,'machine');cyl(x,y,z,75,h*.22,[[0,1],[1,1]],'machine',8);}else if(a.id.startsWith('P41B')){slab(x,y,z-100,w*1.2,d,100);cyl(x-w*.18,y,z,w*.20,h*.62,[[0,1],[.75,1],[1,.72]],'machine',12);box(x+w*.20,y,z,w*.45,d*.52,h*.62,'machine');}else if(a.id.startsWith('L41B01')){tank(x,y,z,w,h,a.id);}else if(a.shape==='pit'){slab(x,y,z,w,d,h);box(x,y,z+h-120,w*.9,d*.9,120,'shell');}else{box(x,y,z,w,d,h,'machine');}return out;}function draw(){let r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);let w=r.width,h=r.height;ctx.clearRect(0,0,w,h);let arr=visible();if(!arr.length)return;let minx=Math.min(...arr.map(a=>a.x)),maxx=Math.max(...arr.map(a=>a.x)),miny=Math.min(...arr.map(a=>a.y)),maxy=Math.max(...arr.map(a=>a.y)),maxz=Math.max(...arr.map(a=>a.z+a.h+mixerHeight(a.id)));let span=Math.max(maxx-minx,maxy-miny,maxz,18000);let s=Math.min(w,h)*.82/span*scale,cx=(minx+maxx)/2,cy=(miny+maxy)/2;let tris=[];for(let a of arr)for(let tri of meshes(a)){let p=tri.p.map(v=>project(v,w,h,cx,cy,s));tris.push({p,z:(p[0][2]+p[1][2]+p[2][2])/3,a,mat:tri.mat});}tris.sort((a,b)=>a.z-b.z);for(let t of tris){ctx.beginPath();ctx.moveTo(t.p[0][0],t.p[0][1]);ctx.lineTo(t.p[1][0],t.p[1][1]);ctx.lineTo(t.p[2][0],t.p[2][1]);ctx.closePath();ctx.fillStyle=t.a.id===selected?'#ffffff':t.mat.startsWith('#')?t.mat:({shell:'#21cfe2',foundation:'#c84d55',steel:'#f0 cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.008;pitch=Math.max(.12,Math.min(1.45,pitch+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY};draw()};cv.onpointerup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();scale=Math.max(.3,Math.min(3,scale*Math.exp(-e.deltaY*.001)));draw()};new ResizeObserver(draw).observe(cv);renderUI();draw();
