<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一层设备基础</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111923;color:#e8eef5;font:14px Segoe UI,Microsoft Yahei,sans-serif}header{height:58px;padding:12px 18px;background:#192431;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0}main{height:calc(100vh - 58px);position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:absolute;left:16px;top:16px;width:310px;padding:15px;background:#192431ed;border:1px solid #344557;border-radius:8px;line-height:1.55}.panel h2{margin:0 0 9px;font-size:17px}.panel p{color:#bac8d7}.panel button{border:1px solid #53677e;background:#253445;color:white;border-radius:5px;padding:7px 12px;cursor:pointer;margin-right:6px}.dims{font-size:14px;color:#f3d39a}.help{font-size:12px;color:#9fb1c3}</style>
<header><h1>二层槽罐顶部 · CH202511DE-5J-41B-05</h1><span><a href="楼层叠加总览.html" style="color:#9bd8e8">查看厂房框架</a> · 拖动旋转 · 滚轮缩放</span></header><main><canvas id="view"></canvas><section class="panel"><h2>一层槽罐顶部轮廓</h2><p>二层平面中的圆形轮廓对应一层槽罐顶部；本层不生成设备底座。</p><p class="dims" id="counts"></p><button id="reset">复位视角</button><button id="shell">显示厂房外框</button><p class="help">顶部显示厚度仅为图形表达，不代表罐顶结构尺寸。东+X、北+Y、上+Z。</p></section></main>
<script src="二层设备基础.js"></script><script>
const c=document.querySelector('#view'),g=c.getContext('2d');let yaw=-Math.PI/4,pitch=35*Math.PI/180,zoom=1,drag=null,showShell=false;
const data=window.FOUNDATIONS, W=data.plan_bounds_mm[0],D=data.plan_bounds_mm[1],T=data.floor===2?120:data.display_thickness_mm,LEVEL=(data.floor-1)*6000;
document.querySelector('#counts').textContent=data.floor===2?`槽罐顶部轮廓 ${data.counts.circle} 个`:`圆形基础 ${data.counts.circle} 个 · 多边形/矩形基础 ${data.counts.polygon} 处`;
function size(){let r=devicePixelRatio||1;c.width=c.clientWidth*r;c.height=c.clientHeight*r;g.setTransform(r,0,0,r,0,0);draw()}
function rawProject(x,y,z){x-=W/2;y-=D/2;const rx=x*Math.cos(yaw)-y*Math.sin(yaw),ry=x*Math.sin(yaw)+y*Math.cos(yaw);return [rx,-ry*Math.sin(pitch)-z*Math.cos(pitch)]}
function polygon(points,color,alpha=1){if(points.length<3)return;g.globalAlpha=alpha;g.beginPath();points.forEach((p,i)=>{let q=P(...p);i?g.lineTo(...q):g.moveTo(...q)});g.closePath();g.fillStyle=color;g.fill();g.strokeStyle='#d4dde5';g.lineWidth=.8;g.stroke();g.globalAlpha=1}
let P=()=>[0,0];function draw(){let w=c.clientWidth,h=c.clientHeight;g.fillStyle='#111923';g.fillRect(0,0,w,h);
 let all=[];for(const f of data.items){if(f.kind==='circle'){for(let i=0;i<24;i++){let a=i*Math.PI/12;all.push([f.cx+f.r*Math.cos(a),f.cy+f.r*Math.sin(a),0])}}else for(const [x,y] of f.points)all.push([x,y,0])}all.push([0,0,0],[W,D,26900]);
 let raw=all.map(p=>rawProject(...p)),loX=Math.min(...raw.map(p=>p[0])),hiX=Math.max(...raw.map(p=>p[0])),loY=Math.min(...raw.map(p=>p[1])),hiY=Math.max(...raw.map(p=>p[1]));let s=Math.min(w/(hiX-loX)*.76,h/(hiY-loY)*.78)*zoom,ox=w/2-(loX+hiX)/2*s,oy=h*.55-(loY+hiY)/2*s;P=(x,y,z)=>{let q=rawProject(x,y,z);return [ox+q[0]*s,oy+q[1]*s]};
 // Shallow rectangular foundation outlines.
 if(data.floor!==2)for(const f of data.items.filter(x=>x.kind==='polygon')){let pts=f.points.filter((p,i,a)=>i===0||p[0]!==a[i-1][0]||p[1]!==a[i-1][1]);if(pts.length<3)continue;for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length];polygon([[a[0],a[1],LEVEL-T],[b[0],b[1],LEVEL-T],[b[0],b[1],LEVEL],[a[0],a[1],LEVEL]],'#9a805f',.92)}polygon(pts.map(p=>[p[0],p[1],LEVEL]),'#c2a277',.98)}
 // Cylindrical equipment plinths use the exact radii in the foundation layer.
 for(const f of data.items.filter(x=>x.kind==='circle')){let top=[],bottom=[];for(let i=0;i<32;i++){let a=i*Math.PI*2/32,x=f.cx+f.r*Math.cos(a),y=f.cy+f.r*Math.sin(a);top.push([x,y,LEVEL]);bottom.push([x,y,LEVEL-T])}for(let i=0;i<32;i++){let j=(i+1)%32;polygon([bottom[i],bottom[j],top[j],top[i]],'#728d9c',.9)}polygon(top,'#a9c1cc',1)}
 if(showShell){g.strokeStyle='#d8e4ed88';g.lineWidth=1.3;let corners=[[0,0],[W,0],[W,D],[0,D]];for(let i=0;i<4;i++){let a=corners[i],b=corners[(i+1)%4];for(const z of [LEVEL,23000,26900]){let p=P(a[0],a[1],z),q=P(b[0],b[1],z);if(z===LEVEL||z===23000){g.beginPath();g.moveTo(...p);g.lineTo(...q);g.stroke()}}let p=P(a[0],a[1],LEVEL),q=P(a[0],a[1],26900);g.beginPath();g.moveTo(...p);g.lineTo(...q);g.stroke()}}
 orientation(w,h)
}
function orientation(w,h){const o=[w-76,h-82],axes=[['东 E',[1,0],'#ed8f87'],['北 N',[0,1],'#86c88b'],['西 W',[-1,0],'#bc9e9a'],['南 S',[0,-1],'#92ad98']];for(const [label,v,color] of axes){const x=v[0]*Math.cos(yaw)-v[1]*Math.sin(yaw),y=v[0]*Math.sin(yaw)+v[1]*Math.cos(yaw),dx=x,dy=-y*Math.sin(pitch);g.beginPath();g.strokeStyle=color;g.lineWidth=1.5;g.moveTo(...o);g.lineTo(o[0]+dx*27,o[1]+dy*27);g.stroke();g.fillStyle=color;g.font='11px Segoe UI,Microsoft Yahei';g.textAlign='center';g.fillText(label,o[0]+dx*43,o[1]+dy*43+4)}g.textAlign='left'}
c.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(0,Math.min(Math.PI/2,drag[3]+(e.clientY-drag[1])*.006));draw()});c.addEventListener('pointerup',()=>drag=null);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.15,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});document.querySelector('#reset').onclick=()=>{yaw=-Math.PI/4;pitch=35*Math.PI/180;zoom=1;draw()};document.querySelector('#shell').onclick=e=>{showShell=!showShell;e.target.textContent=showShell?'隐藏厂房外框':'显示厂房外框';draw()};addEventListener('resize',size);size();
</script></html>
