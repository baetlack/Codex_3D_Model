<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水解厂房框架</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111923;color:#e8eef5;font:14px Segoe UI,Microsoft Yahei,sans-serif}header{height:58px;padding:12px 18px;background:#192431;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0}main{height:calc(100vh - 58px);position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:absolute;left:16px;top:16px;width:320px;padding:15px;background:#192431ed;border:1px solid #344557;border-radius:8px;line-height:1.55}.panel h2{margin:0 0 9px;font-size:17px}.panel p{color:#bac8d7}.panel button{border:1px solid #53677e;background:#253445;color:white;border-radius:5px;padding:7px 12px;cursor:pointer;margin:3px}.help{font-size:12px;color:#9fb1c3}.key{color:#f3d39a}</style>
<header><h1>水解厂房 · 结构框架</h1><span>东南轴测 · 拖动旋转 · 滚轮缩放</span></header>
<main><canvas id="view"></canvas><section class="panel">
 <h2>厂房框架</h2>
 <p>楼层标高 0 / +6 / +12 m，屋面 +23 m，楼梯间顶 +26.9 m。</p>
 <p id="counts" class="key"></p>
 <button id="reset">复位视角</button>
 <p class="help">柱位及截面取自结构图 5.970~9.900 m 柱平面。上部柱线示意延续至 +23 m，需结合上部柱图复核。</p>
 <p><a href="结构立柱定位表.csv" style="color:#9bd8e8">下载结构立柱坐标与截面表（CSV）</a></p>
 <p><a href="index.html" style="color:#9bd8e8">查看厂房外观</a></p>
</section></main>
<script src="结构立柱数据.js"></script><script>
const c=document.querySelector('#view'),g=c.getContext('2d'),COLS=window.STRUCTURE_COLUMNS.columns;
let yaw=-Math.PI/4,pitch=35*Math.PI/180,zoom=1,drag=null;
const {floor_levels:LEVELS,roof_level:ROOF,local_roof_high_point:STAIR_TOP,
 roof_stair_rooms:STAIRS,exterior_wall_extent_x_east_west:W,exterior_wall_extent_y_north_south:D}=STRUCTURE_COLUMNS.building_massing;
const sectionCounts=COLS.reduce((counts,col)=>{
 const size=`${col.width}×${col.depth}`;
 counts[size]=(counts[size]||0)+1;
 return counts;
},{});
document.querySelector('#counts').textContent=`结构柱 ${COLS.length} 根（${Object.entries(sectionCounts).map(([size,count])=>`${size} mm：${count} 根`).join('，')}）`;
function proj(x,y,z){x-=W/2;y-=D/2;const rx=x*Math.cos(yaw)-y*Math.sin(yaw),ry=x*Math.sin(yaw)+y*Math.cos(yaw);return [rx,-ry*Math.sin(pitch)-z*Math.cos(pitch)]}
let P=(x,y,z)=>[0,0];
function face(points,color,alpha=1,stroke=true){if(points.length<3)return;g.globalAlpha=alpha;g.beginPath();points.forEach((p,i)=>{let q=P(...p);i?g.lineTo(...q):g.moveTo(...q)});g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle='#e2e8ed77';g.lineWidth=.65;g.stroke()}g.globalAlpha=1}
function draw(){let w=c.clientWidth,h=c.clientHeight;g.fillStyle='#111923';g.fillRect(0,0,w,h);
 const all=[];for(const z of [LEVELS[0],STAIR_TOP])for(const [x,y] of [[0,0],[W,0],[W,D],[0,D]])all.push(proj(x,y,z));
 let ax=Math.min(...all.map(p=>p[0])),bx=Math.max(...all.map(p=>p[0])),ay=Math.min(...all.map(p=>p[1])),by=Math.max(...all.map(p=>p[1]));let s=Math.min(w/(bx-ax)*.68,h/(by-ay)*.76)*zoom,ox=w/2-(ax+bx)/2*s,oy=h*.56-(ay+by)/2*s;P=(x,y,z)=>{let q=proj(x,y,z);return [ox+q[0]*s,oy+q[1]*s]};
 const xs=[0,6000,13000,19000,26000,32000,38000,44000],ys=Array.from({length:11},(_,i)=>i*7200);
 const edge=(a,b,color='#c7d4dd',width=1)=>{g.beginPath();g.moveTo(...P(...a));g.lineTo(...P(...b));g.strokeStyle=color;g.lineWidth=width;g.stroke()};
 const beam=(a,b,z,color='#a9bac5',width=2)=>edge([a[0],a[1],z],[b[0],b[1],z],color,width);
 const col=(q,z0,z1)=>{const a=q.x-q.width/2,b=q.y-q.depth/2,x=q.width,y=q.depth;face([[a,b,z0],[a+x,b,z0],[a+x,b,z1],[a,b,z1]],'#708895',.99);face([[a+x,b,z0],[a+x,b+y,z0],[a+x,b+y,z1],[a+x,b,z1]],'#526c7b',.99);face([[a+x,b+y,z0],[a,b+y,z0],[a,b+y,z1],[a+x,b+y,z1]],'#8196a1',.99);face([[a,b+y,z0],[a,b,z0],[a,b,z1],[a,b+y,z1]],'#637b89',.99);face([[a,b,z1],[a+x,b,z1],[a+x,b+y,z1],[a,b+y,z1]],'#9bafba',.99)};
 for(const q of COLS)for(let k=0;k<3;k++)col(q,STRUCTURE_COLUMNS.story_ranges_mm[k][0],STRUCTURE_COLUMNS.story_ranges_mm[k][1]);
 for(const z of LEVELS){for(const y of ys)for(let i=0;i<xs.length-1;i++)beam([xs[i],y],[xs[i+1],y],z,z===ROOF?'#b99c72':'#a9bac5',z===ROOF?2.1:1.6);for(const x of xs)for(let j=0;j<ys.length-1;j++)beam([x,ys[j]],[x,ys[j+1]],z,z===ROOF?'#b99c72':'#a9bac5',z===ROOF?2.1:1.6)}
 for(const {x,y,width,depth} of STAIRS){
  const corners=[[x,y],[x+width,y],[x+width,y+depth],[x,y+depth]];
  for(let i=0;i<corners.length;i++){
   const p=corners[i],q=corners[(i+1)%corners.length];
   edge([...p,ROOF],[...q,ROOF],'#89a2b0',2);
   edge([...p,STAIR_TOP],[...q,STAIR_TOP],'#89a2b0',2);
   edge([...p,ROOF],[...p,STAIR_TOP],'#89a2b0',2);
  }
 }
 orientation(w,h);
}
function orientation(w,h){const o=[w-76,h-82],axes=[['东 E',[1,0],'#ed8f87'],['北 N',[0,1],'#86c88b'],['西 W',[-1,0],'#bc9e9a'],['南 S',[0,-1],'#92ad98']];for(const [label,v,color] of axes){const x=v[0]*Math.cos(yaw)-v[1]*Math.sin(yaw),y=v[0]*Math.sin(yaw)+v[1]*Math.cos(yaw),dx=x,dy=-y*Math.sin(pitch);g.beginPath();g.strokeStyle=color;g.lineWidth=1.5;g.moveTo(...o);g.lineTo(o[0]+dx*27,o[1]+dy*27);g.stroke();g.fillStyle=color;g.font='11px Segoe UI,Microsoft Yahei';g.textAlign='center';g.fillText(label,o[0]+dx*43,o[1]+dy*43+4)}g.textAlign='left'}
function size(){let r=devicePixelRatio||1;c.width=c.clientWidth*r;c.height=c.clientHeight*r;g.setTransform(r,0,0,r,0,0);draw()}
c.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,yaw,pitch];c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(0,Math.min(Math.PI/2,drag[3]+(e.clientY-drag[1])*.006));draw()});c.addEventListener('pointerup',()=>drag=null);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.15,Math.min(8,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});addEventListener('resize',size);
document.querySelector('#reset').onclick=()=>{yaw=-Math.PI/4;pitch=35*Math.PI/180;zoom=1;draw()};size();
</script></html>
