<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水解设备三维模型</title>
<style>
  * { box-sizing:border-box }
  body { background:#101a22; color:#e3edf1; font:14px "Microsoft YaHei",sans-serif; margin:0 }
  header,aside { padding:16px 22px }
  header { border-bottom:1px solid #2f414a }
  aside { border-left:1px solid #2f414a; overflow:auto }
  h1 { font-size:22px; margin:0 }
  h2 { font-size:14px; color:#9ad6cd; margin:18px 0 8px }
  p { line-height:1.65 }
  main { display:grid; grid-template-columns:minmax(0,1fr) 285px; height:calc(100dvh - 66px); min-height:440px }
  section { display:grid; grid-template-rows:auto minmax(0,1fr) auto; min-height:300px; overflow:hidden; background:radial-gradient(ellipse at 46% 42%,#304553,#182731 70%,#14212b) }
  canvas { display:block; width:100%; height:100%; min-height:0; touch-action:none; cursor:grab }
  canvas:active { cursor:grabbing }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; padding:14px 16px 0 }
  button,select { background:#1d313b; color:#e1eff2; padding:7px 10px; border:1px solid #49616c; border-radius:5px; font:inherit }
  button { cursor:pointer }
  a { color:#9ad6cd }
  #bounds { font-size:16px; font-variant-numeric:tabular-nums }
  .view-status { display:flex; justify-content:space-between; align-items:end; gap:10px; padding:8px 16px 14px; color:#bacdd5; font-size:12px; line-height:1.6 }
  #view-label { color:#e1eff2 }
  #scale-bar { display:block; text-align:center; white-space:nowrap; margin-left:auto }
  #scale-bar::after { display:block; content:""; width:var(--bar-width,0px); height:5px; border:solid #9abfc9; border-width:0 1px 1px }
  #links a { display:block; margin:8px 0 }
  @media(max-width:760px) { main { display:block; height:auto } section { height:62vh } aside { border-left:0;border-top:1px solid #2f414a } }
</style>
<header><h1 id="title">水解设备三维模型</h1></header>
<main>
  <section>
    <div class="toolbar">
      <button id="reset">东南复位</button><button id="side">正立侧视</button><button id="top">俯视</button>
      <button id="inlet" hidden>进风侧轴测</button>
      <select id="group" aria-label="显示部件"><option value="">全部部件</option></select>
    </div>
    <canvas id="canvas" aria-label="可旋转三维模型"></canvas>
    <footer class="view-status">
      <div><strong id="view-label">正交投影</strong><br><span id="status">拖动旋转 · 滚轮缩放</span></div>
      <span id="scale-bar" aria-label="当前视图比例尺"></span>
    </footer>
  </section>
  <aside>
    <a href="index.html">返回设备清单</a>
    <h2>台账规格</h2><p id="spec"></p>
    <h2>模型包络 · X × Y × Z</h2><p id="bounds"></p>
    <h2>建模依据</h2><p id="note"></p>
    <h2>图纸与导出</h2><div id="links"></div>
  </aside>
</main>
<script src="models.js"></script>
<script src="../orthographic_viewer.js"></script>
<script>
  const element = id => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('model');
  const model = window.BATCH_MODELS && Object.hasOwn(BATCH_MODELS,key) ? BATCH_MODELS[key] : null;
  const canvas = element('canvas');
  if (!model) {
    element('status').textContent = '请从设备清单选择模型。';
  } else {
    const folder = '模型/' + key + '/';
    element('title').textContent = key + ' · ' + model.name;
    document.title = element('title').textContent;
    element('spec').textContent = model.spec;
    element('note').textContent = model.note;
    element('bounds').textContent = model.bounds ? model.bounds.join(' × ')+' mm' : '见参数记录';
    const links = Object.entries(model.views).map(([name,view]) => [name,view.文件]);
    if (model.reference) links.push(['外形参考图', model.reference]);
    if (model.portsReference) links.push(['进出口参考图', model.portsReference]);
    if (model.layout) links.push(['布置图量测轮廓', model.layout]);
    links.push(['下载 GLB', folder + key + '.glb'], ['下载 OBJ', folder + key + '.obj'],
      ['下载 OBJ 材质', folder + key + '.mtl'], ['参数 JSON', folder + '参数.json']);
    for (const [name,url] of links) {
      const link = document.createElement('a');
      link.textContent = name;
      link.href = url;
      if (name.startsWith('下载')) link.download = '';
      element('links').append(link);
    }
    const script = document.createElement('script');
    script.src = folder + 'model_data.js';
    script.onload = () => {
      try { init(window.MODEL_PARTS); }
      catch (error) { element('status').textContent = '三维预览无法打开。可通过上方链接下载模型。'; console.error(error); }
    };
    script.onerror = () => { element('status').textContent = '模型数据文件未找到。'; };
    document.body.append(script);
  }

  function init(parts) {
    const group = element('group');
    const groupOf = part => part.name.split('_')[0];
    for (const name of new Set(parts.map(groupOf))) group.add(new Option(name,name));
    const extraView = model.layout ? {yaw:-3*Math.PI/4,label:'泵端轴测'} :
      key === 'P41B10' ? {yaw:Math.PI*.83,label:'进风侧轴测'} : null;
    startEquipmentViewer(parts,{
      canvas, selectControl:group, extraView, doubleSided:true,
      isVisible(part,filter) { return !filter || groupOf(part)===filter; }
    });
  }
</script>
</html>
