<circle cx="278" cy="711" r="36" fill="#fae4d4" stroke="#b24a22" stroke-width="2.5"/>
<circle cx="278" cy="711" r="16" fill="#fff6ee" stroke="#b24a22" stroke-width="1.8"/>
<path d="M266 711H290M278 699V723" stroke="#b24a22" stroke-width="1.3"/>
<path d="M304 733L333 766H356" fill="none" stroke="#b24a22" stroke-width="1.7"/>
<rect x="356" y="749" width="334" height="34" rx="6" fill="#fff6ee" stroke="#e2b69b"/>
<text x="368" y="771" font-size="15" font-weight="600" style="fill:#9b3719">竖向出口，圆心位于轴线下侧</text>
<text x="52" y="827" font-size="15">五类泵共用外形与出口朝向。各泵外形尺寸、法兰规格和基础待分别核对。</text>
</svg>