<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title desc">
<title id="title">五类卧式泵 · 共用外形示意</title>
<desc id="desc">紧凑卧式泵组，左侧泵头轴向进液，泵壳偏置竖直出液，右侧连接电机。</desc>
<defs>
  <linearGradient id="pump" x2="0" y2="1"><stop stop-color="#bfd2cf"/><stop offset="1" stop-color="#6f9d99"/></linearGradient>
  <linearGradient id="bearing" x2="0" y2="1"><stop stop-color="#a1aeb5"/><stop offset="1" stop-color="#647b87"/></linearGradient>
  <linearGradient id="motor" x2="0" y2="1"><stop stop-color="#9fb5c5"/><stop offset="1" stop-color="#68899e"/></linearGradient>
  <style>
    text {font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif; fill:#193143}
    .label {font-size:17px;font-weight:600}
    .sub {font-size:13px;fill:#526b7b}
    .leader {fill:none;stroke:#466d82;stroke-width:1.6}
    .dot {fill:#466d82}
    .metal {stroke:#284958;stroke-width:2.1;stroke-linejoin:round}
    .seam {fill:none;stroke:#395969;stroke-width:1.5}
    .card {fill:#fff;stroke:#cbdbe3}
  </style>
</defs>
<rect width="1120" height="860" fill="#f6f9fb"/>
<text x="47" y="55" font-size="29" font-weight="700">五类卧式泵 · 共用外形示意</text>
<text x="49" y="85" font-size="15" fill="#526b7b">适用位号 P41B01 / P41B02 / P41B03 / P41B05 / P41B06 · 无比例</text>
<path d="M48 106H1072" stroke="#cbdbe3"/>
<text x="978" y="145" font-size="17" font-weight="700">侧向示意</text>
<path d="M135 328H984" stroke="#6c929f" stroke-width="1.4" stroke-dasharray="10 5 2 5" opacity=".75"/>
<text x="943" y="318" class="sub">传动轴线</text>

