<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#101923;color:#cbd9e2;font:13px sans-serif}canvas{width:100%;height:100%;display:block}.label{position:absolute;top:10px;left:12px;pointer-events:none}</style><canvas id="scene"></canvas><div class="label" id="label"></div><script src="../../../orthographic_viewer.js"></script><script>
const previous=new URLSearchParams(location.search).get('revision')==='01';document.getElementById('label').textContent=previous?'01 · 上一版（保留）':'02 · 顶侧结构修正';const loader=document.createElement('script');loader.src=previous?'历史/2.0-C41B02-01/设备/model_data.js':'设备/model_data.js';let mesh,viewer;
window.previewView=mode=>{if(!viewer)return;let shown=mesh;if(mode==='top')shown=mesh.filter(p=>/^(Tank_cover|Lid_|接口_|盖面_)/.test(p.name));if(mode==='g')shown=mesh.filter(p=>p.name.startsWith('接口_g_'));if(mode==='h')shown=mesh.filter(p=>p.name.startsWith('接口_h_'));if(mode==='seat')shown=mesh.filter(p=>p.name.startsWith('盖面_m_')||p.name.startsWith('06_'));viewer.setParts(shown);viewer.view(mode==='top'?-Math.PI/2:-Math.PI/4,mode==='top'?Math.PI/2:.36,mode);viewer.fit();};
loader.onload=()=>{mesh=window.MODEL_PARTS;viewer=createEquipmentViewer(document.getElementById('scene'),{doubleSided:true,centerProjection:true});window.previewView('all');window.compareReady=true;};document.head.append(loader);
</script></html>
