<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{margin:0;background:#101923;color:#dce8ef;font:14px sans-serif}#label{position:absolute;top:15px;left:18px}#scene{width:100vw;height:100vh}</style><div id="label"></div><canvas id="scene"></canvas><script src="../../../orthographic_viewer.js"></script><script>const old=new URLSearchParams(location.search).get('version')==='old';document.getElementById('label').textContent=old?'设备1.0 · 平底示意':'设备2.0 · 按适用总图';const s=document.createElement('script');s.src=old?'../../1.0/快照/水解设备模型库/示图建模_20260521/模型/L41B01/model_data.js':'设备/model_data.js';s.onload=()=>{const mesh=window.MODEL_PARTS,v=createEquipmentViewer(document.getElementById('scene'),{doubleSided:true,centerProjection:true});window.previewView=mode=>{window.previewMode=mode;let parts=mesh;if(mode==='ears')parts=mesh.filter(p=>p.name.startsWith('托耳_'));if(mode==='bottom')parts=mesh.filter(p=>p.name.includes('锥')||p.name.startsWith('接口_c_'));if(!parts.length)parts=mesh;v.setParts(parts);v.view(mode==='top'?-Math.PI/2:-Math.PI/4,mode==='top'?Math.PI/2:mode==='bottom'?-.28:.35,mode);v.fit();};window.addEventListener('message',e=>{if(e.data?.type==='preview-view'&&['all','top','ears','bottom'].includes(e.data.mode))window.previewView(e.data.mode);});window.previewView('all');window.compareReady=true;};document.head.append(s);</script></html>
