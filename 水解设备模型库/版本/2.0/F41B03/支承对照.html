<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>四耳/四墩支承诊断</title><style>html,body{margin:0;background:#101923;color:#dce8ef;font:15px sans-serif}header{padding:15px 20px;line-height:1.8}a{color:#7cdce6}button{background:#1c3040;color:#dce8ef;border:1px solid #486170;padding:8px;margin:3px;cursor:pointer}.pending{padding:10px 20px;background:#403325}main{display:grid;grid-template-columns:minmax(0,1fr) 310px}canvas{width:100%;height:72vh;display:block}aside{padding:25px;line-height:2}b{color:#f1c183}@media(max-width:850px){main{grid-template-columns:1fr}}</style><header><strong>F41B03 · 支承平面差异诊断</strong> · <a href="整改说明.html">来源与待核项</a><br><button data-view="top">俯视全图</button><button data-view="iso">轴测</button><button data-view="east">东侧局部</button></header><div class="pending">耳底和支墩顶暂设同高本地Z0，仅诊断平面搭接；不是厂房安装方案，未确认实际承托标高。</div><main><canvas id="scene"></canvas><aside>四耳外端：591.25 mm<br>四墩内缘：600 mm<br><b>轴向净距：8.75 mm</b><br>耳孔中心：550 mm<br>预埋板中心：750 mm<br><b>中心差：200 mm</b><br>直接搭接面积：0 mm²<br><br>原设备与支墩尺寸保持。过渡件、托耳高度与承托EL待核。<p><a href="支承差异.json">四向数值记录</a><br><a href="../../../index.html?type=F41B03">设备/基础独立下载</a></p></aside></main><script src="../../../orthographic_viewer.js"></script><script>
async function load(src){return await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>{const p=window.MODEL_PARTS;delete window.MODEL_PARTS;s.remove();resolve(p);};s.onerror=reject;document.head.append(s);});}
(async()=>{const equipment=await load('设备/model_data.js'),base=await load('基础/model_data.js');const viewer=createEquipmentViewer(document.getElementById('scene'),{doubleSided:true,centerProjection:true});window.diagnosticView=mode=>{let parts=[...equipment,...base];if(mode==='east')parts=[...equipment.filter(p=>p.name.includes('R1_')),...base.filter(p=>Math.min(...p.vertices.map(v=>v[0]))>=599)];viewer.setParts(parts);viewer.view(mode==='top'?-Math.PI/2:-Math.PI/4,mode==='top'?Math.PI/2:.35,mode);viewer.fit();window.diagnosticMode=mode;window.diagnosticParts=parts.length;};for(const b of document.querySelectorAll('button[data-view]'))b.onclick=()=>window.diagnosticView(b.dataset.view);window.diagnosticView('top');window.diagReady=true;})();
</script></html>
