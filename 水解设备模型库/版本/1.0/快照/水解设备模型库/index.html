<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水解工段设备模型库</title>

margin:5px 8px 5px 0;font-size:12px}.links a:hover{text-decoration:underline}.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.views img{width:100%;max-height:145px;object-fit:contain;background:#202b33;border-radius:4px}.views figure{margin:0}.views figcaption{font-size:10px;color:#90a7b6}.stat{position:absolute;right:12px;bottom:10px;font-size:11px;color:#a3b5c2}.hint{position:absolute;left:14px;bottom:12px;color:#9db0be;font-size:11px}.badge{display:inline-block;padding:3px 7px;border:1px solid #3f5b70;border-radius:12px;color:#a9c7d4;font-size:10px;margin-left:6px}
.layout{grid-template-columns:var(--left,270px) minmax(0,1fr) var(--right,320px);grid-template-areas:"directory scene details"}
.layout.left-closed{--left:38px}.layout.right-closed{--right:38px}
nav{grid-area:directory}main{grid-area:scene;min-width:0;min-height:0;height:auto}aside{grid-area:details;grid-column:auto;overflow-wrap:anywhere}
[hidden]{display:none!important}nav,aside{min-width:0;max-height:none}
.catalog-heading{font-size:16px;margin:0 0 10px}
#list strong{display:block;font-size:16px;line-height:1.4}
#list small{font-size:11px}
.toolbar{right:12px;max-width:none;align-items:center;pointer-events:none}.toolbar>*{pointer-events:auto}

.panel-content{min-height:0;overflow:auto}

.panel-toggle:hover,.panel-toggle:focus-visible{background:#24394a;color:#e5edf3}

.left-closed nav,.right-closed aside{padding:6px 3px}

#scene{cursor:grab}#scene:active{cursor:grabbing}

<header>
  <div><h1>水解工段 · 设备模型库 <span class="badge" id="library-count"></span></h1><small>2026.5.21 台账 · 东 +X / 北 +Y / 上 +Z</small></div>
</header>
<div class="layout">
  <nav aria-label="设备目录">
    <button id="toggle-list" class="panel-toggle" type="button" aria-controls="directory" aria-expanded="true" aria-label="收起目录" title="收起目录">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65"><rect class="panel-fill" x="4" y="5.5" width="5" height="13" stroke="none"/><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M9 5v14"/></svg>
    </button>
    <div id="directory" class="panel-content">
      <h2 class="catalog-heading">模型与台账</h2>
      <input id="search" placeholder="搜索位号、名称或规格" aria-label="搜索位号、名称或规格">
      <div class="filters"><select id="state" aria-label="筛选建模状态"><option value="">全部状态</option></select></div>
      <details class="note"><summary>台账、原图与补充视图</summary><div class="links" id="sources"></div></details>
      <div id="count" class="meta"></div><div id="list"></div>
    </div>
  </nav>
  <main aria-label="三维预览">
    <canvas id="scene" aria-label="可旋转的正交三维模型"></canvas><canvas id="overlay"></canvas>
    <div id="preview-message" class="preview-message" role="status" hidden></div>
    <div class="toolbar"><button id="iso">东南复位</button><button id="top">俯视</button><button id="front">侧视</button><button id="fit">居中适配</button><button id="extra-view" hidden></button><select id="foundation-mode" aria-label="设备与基础显示" hidden></select><select id="group" aria-label="显示部件" hidden></select><label id="dimensions" style="font-size:11px" hidden><input id="showDim" type="checkbox" checked>尺寸标注</label></div>
    <div class="hint">拖动旋转 · Shift + 拖动平移 · 滚轮缩放</div>
    <div class="stat"><div id="status"></div><span id="scale-bar" aria-label="当前视图比例尺" hidden></span></div>
  </main>
  <aside aria-label="设备详情">
    <button id="toggle-detail" class="panel-toggle" type="button" aria-controls="details" aria-expanded="true" aria-label="收起详情" title="收起详情">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65"><rect class="panel-fill" x="15" y="5.5" width="5" height="13" stroke="none"/><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M15 5v14"/></svg>
    </button>
    <div id="details" class="panel-content"><div id="detail" class="meta"></div><div id="views" class="views"></div></div>
  </aside>
</div>
